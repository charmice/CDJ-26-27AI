    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Noto+Sans+JP:wght@500;700;900&family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cdj: {
                            bg: '#070913',
                            panel: '#0e1222',
                            card: '#161c33',
                            border: '#242e4d',
                            cyan: '#00f0ff',
                            magenta: '#ff0055',
                            yellow: '#ffcc00',
                            gold: '#ffd700'
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans KR', 'Noto Sans JP', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #070913;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 0, 85, 0.12), transparent 40%),
                radial-gradient(circle at 10% 30%, rgba(0, 240, 255, 0.08), transparent 30%),
                radial-gradient(circle at 90% 70%, rgba(123, 44, 191, 0.12), transparent 35%);
            background-attachment: fixed;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #070913;
        }
        ::-webkit-scrollbar-thumb {
            background: #242e4d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00f0ff;
        }

        /* Card Drag & Drop Effects */
        .artist-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
            touch-action: none;
            user-select: none;
        }
        .artist-card:hover {
            border-color: rgba(0, 240, 255, 0.5);
            transform: translateY(-2px);
        }
        .artist-card.dragging {
            opacity: 0.35;
            transform: scale(0.96);
            border-style: dashed !important;
            border-color: #00f0ff !important;
        }
        .artist-list.drag-over {
            background-color: rgba(0, 240, 255, 0.05);
            border-color: #00f0ff !important;
            box-shadow: inset 0 0 12px rgba(0, 240, 255, 0.15);
        }

        /* Neon Highlight for Selected Cards */
        .artist-card.highlighted {
            background: linear-gradient(135deg, rgba(22, 28, 51, 0.95) 0%, rgba(0, 240, 255, 0.22) 100%) !important;
            border-color: #00f0ff !important;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4), inset 0 0 10px rgba(0, 240, 255, 0.15);
        }
        .artist-card.highlighted .artist-name {
            color: #ffffff !important;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.7);
        }
        .artist-card.highlighted .badge-new {
            box-shadow: 0 0 8px rgba(255, 0, 85, 0.8);
        }

        /* Poster Title Glow */
        .poster-title {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3), 0 0 35px rgba(0, 240, 255, 0.2);
        }
    </style>
</head>
<body class="text-slate-100 font-sans min-h-screen flex flex-col selection:bg-cdj-magenta selection:text-white">

    <!-- Header Section -->
    <header class="relative border-b border-cdj-border/80 pt-8 pb-6 px-4 sm:px-8 bg-slate-950/70 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="text-center md:text-left">
                <div class="inline-flex items-center gap-2 bg-gradient-to-r from-cdj-magenta/20 to-purple-600/20 border border-cdj-magenta/40 text-cdj-magenta text-[11px] font-extrabold px-3 py-1 rounded-full mb-2 uppercase tracking-widest">

                    <span class="text-slate-400">|</span>
                    <span class="text-cdj-yellow">Supported by au</span>
                </div>
                <h1 class="poster-title text-3xl sm:text-5xl font-black font-display tracking-tight text-white flex items-center justify-center md:justify-start gap-2">

                </h1>
                <p class="text-slate-400 text-xs sm:text-sm mt-2 flex items-center justify-center md:justify-start gap-2">
                    <i data-lucide="grab" class="w-4 h-4 text-cdj-cyan"></i>
                    카드 체크박스를 눌러 관심 아티스트를 강조하고, <span class="text-cdj-cyan font-bold">마우스로 끌어서</span> 일정을 자유롭게 배치하세요!
                </p>
            </div>

            <!-- Total Counter Card -->
            <div class="flex items-center gap-3 w-full md:w-auto justify-center md:justify-end">
                <div class="bg-cdj-panel border border-cdj-border rounded-2xl p-3 px-5 flex items-center gap-4 shadow-xl">
                    <div class="text-center">
                        <span class="text-[10px] font-bold text-slate-400 uppercase block">전체 아티스트</span>
                        <span id="total-count" class="text-xl font-extrabold font-display text-slate-200">0</span>
                        <span class="text-[10px] text-slate-500">팀</span>
                    </div>
                    <div class="w-px h-8 bg-cdj-border"></div>
                    <div class="text-center">
                        <span class="text-[10px] font-bold text-cdj-cyan uppercase block">선택한 아티스트</span>
                        <span id="selected-count" class="text-2xl font-black font-display text-cdj-cyan">0</span>
                        <span class="text-[10px] text-slate-400">팀</span>
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <button id="reset-btn" class="flex items-center justify-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold py-2 px-3 rounded-xl border border-cdj-border transition shadow-sm">
                        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> 초기화
                    </button>
                    <button id="add-artist-btn" class="flex items-center justify-center gap-1.5 bg-gradient-to-r from-cdj-cyan to-blue-600 hover:from-blue-500 hover:to-cdj-cyan text-slate-950 font-black text-xs py-2 px-3 rounded-xl shadow-lg transition transform hover:-translate-y-0.5">
                        <i data-lucide="plus" class="w-4 h-4"></i> 추가
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation & Filter Bar -->

            <!-- Quick Filter Controls -->

                    전체 보기

                <button id="filter-selected-btn" class="filter-tab bg-cdj-panel border border-cdj-border text-slate-300 hover:text-white font-bold text-xs px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5">

                    선택한 아티스트만 보기

            </div>

            <!-- Search Bar -->

                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
                <input type="text" id="search-input" placeholder="아티스트 이름 검색..." class="w-full bg-cdj-panel border border-cdj-border text-xs rounded-xl pl-9 pr-3 py-2 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cdj-cyan transition">

                        취소

                    <button type="submit" class="flex-1 bg-cdj-cyan text-slate-950 font-black py-2 rounded-xl text-xs shadow-md hover:bg-cyan-300">
                        추가하기
                    </button>
                </div>
            </form>
        </div>
    </div>

        // Format into state array with IDs & default selections
        const defaultArtists = initialRawData.map((item, idx) => ({
            id: 'art-' + (idx + 1),
            date: item.date,
            name: item.name,
            isNew: item.isNew,
            selected: false
        }));

        // State variables
        let artists = JSON.parse(localStorage.getItem('cdj2627_full_lineup')) || defaultArtists;
        let searchQuery = '';
        let onlySelectedFilter = false;
        let draggedArtistId = null;

        function initIcons() {
            if (window.lucide) lucide.createIcons();
        }

        // Main Render Function
        function render() {
            const days = ['12/26', '12/27', '12/29', '12/30', '12/31'];

            days.forEach(day => {
                const listEl = document.getElementById(`list-${day.replace('/', '')}`);
                const countEl = document.getElementById(`count-${day.replace('/', '')}`);
                if (!listEl) return;

                const dayArtists = artists.filter(a => a.date === day);
                const selectedInDay = dayArtists.filter(a => a.selected).length;

                if (countEl) {
                    countEl.innerText = `${selectedInDay}/${dayArtists.length}`;
                    if (selectedInDay > 0) {
                        countEl.classList.add('text-cdj-cyan', 'border-cdj-cyan/50');
                    } else {
                        countEl.classList.remove('text-cdj-cyan', 'border-cdj-cyan/50');
                    }
                }

                // Filter logic
                const filtered = dayArtists.filter(a => {
                    const matchSearch = a.name.toLowerCase().includes(searchQuery.toLowerCase());
                    const matchSelected = !onlySelectedFilter || a.selected;
                    return matchSearch && matchSelected;
                });

                if (filtered.length === 0) {
                    listEl.innerHTML = `
                        <div class="h-28 flex flex-col items-center justify-center border border-dashed border-cdj-border/60 rounded-xl text-slate-500 text-xs p-3 text-center pointer-events-none select-none">
                            <i data-lucide="inbox" class="w-5 h-5 mb-1 opacity-40"></i>
                            표시할 아티스트가 없습니다
                        </div>
                    `;
                } else {
                    listEl.innerHTML = filtered.map(artist => `
                        <div data-id="${artist.id}" 
                             draggable="true" 
                             class="artist-card bg-cdj-card border ${artist.selected ? 'highlighted' : 'border-cdj-border'} p-2.5 rounded-xl flex items-center justify-between gap-2 relative group cursor-grab active:cursor-grabbing">
                            
                            <div class="flex items-center gap-2.5 min-w-0 flex-1">
                                <input type="checkbox" ${artist.selected ? 'checked' : ''} 
                                       onchange="toggleSelect('${artist.id}', event)"
                                       class="artist-checkbox w-4 h-4 rounded border-slate-600 text-cdj-cyan focus:ring-0 focus:ring-offset-0 bg-slate-900 cursor-pointer flex-shrink-0">
                                
                                <span class="artist-name font-bold text-xs text-slate-200 truncate group-hover:text-cdj-cyan transition-colors">
                                    ${escapeHtml(artist.name)}
                                </span>

                                ${artist.isNew ? `
                                    <span class="badge-new text-[9px] font-black bg-cdj-magenta text-white px-1.5 py-0.2 rounded uppercase tracking-tighter flex-shrink-0">
                                        NEW
                                    </span>

            attachDragAndDropListeners();
            initIcons();
            saveToLocalStorage();
        }

        // HTML5 Drag and Drop logic
        function attachDragAndDropListeners() {
            const cards = document.querySelectorAll('.artist-card');
            const lists = document.querySelectorAll('.artist-list');

            cards.forEach(card => {
                card.addEventListener('dragstart', (e) => {
                    draggedArtistId = card.getAttribute('data-id');
                    card.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', draggedArtistId);
                });

                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                    lists.forEach(l => l.classList.remove('drag-over'));
                });
            });

            lists.forEach(list => {
                list.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    list.classList.add('drag-over');

                    const afterElement = getDragAfterElement(list, e.clientY);
                    const draggingCard = document.querySelector('.dragging');
                    if (draggingCard && list) {
                        if (afterElement == null) {
                            list.appendChild(draggingCard);
                        } else {
                            list.insertBefore(draggingCard, afterElement);
                        }
                    }
                });

                list.addEventListener('dragleave', () => {
                    list.classList.remove('drag-over');
                });

                list.addEventListener('drop', (e) => {
                    e.preventDefault();
                    list.classList.remove('drag-over');
                    updateStateFromDOM();
                });
            });
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.artist-card:not(.dragging)')];

            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function updateStateFromDOM() {
            const newArtists = [];
            const days = ['12/26', '12/27', '12/29', '12/30', '12/31'];

            days.forEach(day => {
                const listEl = document.getElementById(`list-${day.replace('/', '')}`);
                if (!listEl) return;
                
                const cardNodes = listEl.querySelectorAll('.artist-card');
                cardNodes.forEach(node => {
                    const id = node.getAttribute('data-id');
                    const existing = artists.find(a => a.id === id);
                    if (existing) {
                        newArtists.push({
                            ...existing,
                            date: day
                        });
                    }
                });
            });

            // Keep filtered out artists preserved
            artists.forEach(a => {
                if (!newArtists.some(na => na.id === a.id)) {
                    newArtists.push(a);
                }
            });

            artists = newArtists;
            render();
        }

        // Toggle Selection
        window.toggleSelect = function(id, event) {
            if(event) event.stopPropagation();
            artists = artists.map(a => a.id === id ? { ...a, selected: !a.selected } : a);
            render();
        }

        // Delete Individual Artist
        window.deleteArtist = function(id, event) {
            if(event) event.stopPropagation();
            artists = artists.filter(a => a.id !== id);
            render();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function saveToLocalStorage() {
            localStorage.setItem('cdj2627_full_lineup', JSON.stringify(artists));
        }

        // DOM Ready Initializer
        document.addEventListener('DOMContentLoaded', () => {
            render();

            // Search Filter
            document.getElementById('search-input').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                render();
            });

            // Filter Tabs
            const filterAllBtn = document.getElementById('filter-all-btn');
            const filterSelectedBtn = document.getElementById('filter-selected-btn');

            filterAllBtn.addEventListener('click', () => {
                onlySelectedFilter = false;
                filterAllBtn.className = 'filter-tab active bg-cdj-cyan text-slate-950 font-bold text-xs px-3.5 py-1.5 rounded-lg transition shadow-md';
                filterSelectedBtn.className = 'filter-tab bg-cdj-panel border border-cdj-border text-slate-300 hover:text-white font-bold text-xs px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5';
                render();
            });

            filterSelectedBtn.addEventListener('click', () => {
                onlySelectedFilter = true;
                filterSelectedBtn.className = 'filter-tab active bg-cdj-cyan text-slate-950 font-bold text-xs px-3.5 py-1.5 rounded-lg transition shadow-md flex items-center gap-1.5';
                filterAllBtn.className = 'filter-tab bg-cdj-panel border border-cdj-border text-slate-300 hover:text-white font-bold text-xs px-3.5 py-1.5 rounded-lg transition';
                render();
            });

            // Reset Button
            document.getElementById('reset-btn').addEventListener('click', () => {
                if (confirm('모든 아티스트 순서 및 체크박스 선택을 포스터 기본 상태로 초기화하시겠습니까?')) {
                    artists = [...defaultArtists];
                    render();
                }
            });

            // Modal Events
            const modal = document.getElementById('add-modal');
            const openModalBtn = document.getElementById('add-artist-btn');
            const closeModalBtn = document.getElementById('close-modal-btn');
            const cancelModalBtn = document.getElementById('cancel-modal-btn');
            const addForm = document.getElementById('add-artist-form');

            openModalBtn.addEventListener('click', () => modal.classList.remove('hidden'));
            closeModalBtn.addEventListener('click', () => modal.classList.add('hidden'));
            cancelModalBtn.addEventListener('click', () => modal.classList.add('hidden'));

            addForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const newName = document.getElementById('modal-name').value.trim();
                const newDate = document.getElementById('modal-date').value;

                if (newName) {
                    artists.unshift({
                        id: 'custom-' + Date.now(),
                        date: newDate,
                        name: newName,
                        isNew: true,
                        selected: true
                    });
                    render();
                    addForm.reset();
                    modal.classList.add('hidden');
                }
            });
        });
