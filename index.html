<!DOCTYPE html>
<html lang="ko">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Noto+Sans+JP:wght@500;700;900&family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cdj: {
                            bg: '#070913',
                            panel: '#0e1222',
                            card: '#161c33',
                            border: '#242e4d',
                            cyan: '#00f0ff',
                            magenta: '#ff0055',
                            yellow: '#ffcc00',
                            gold: '#ffd700'
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans KR', 'Noto Sans JP', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #070913;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 0, 85, 0.15), transparent 45%),
                radial-gradient(circle at 10% 30%, rgba(0, 240, 255, 0.10), transparent 35%),
                radial-gradient(circle at 90% 70%, rgba(123, 44, 191, 0.15), transparent 40%);
            background-attachment: fixed;
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #070913;
        }
        ::-webkit-scrollbar-thumb {
            background: #242e4d;
            border-radius: 4px;
        }

        /* Mobile Drag & Touch Styling */
        .artist-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
            user-select: none;
            -webkit-user-select: none;
        }
        .artist-card.dragging {
            opacity: 0.4;
            transform: scale(0.97);
            border-style: dashed !important;
            border-color: #00f0ff !important;
        }
        .artist-list.drag-over {
            background-color: rgba(0, 240, 255, 0.08);
            border-color: #00f0ff !important;
            border-style: dashed !important;
        }

        /* Neon Highlight for Selected Cards */
        .artist-card.highlighted {
            background: linear-gradient(135deg, rgba(22, 28, 51, 0.98) 0%, rgba(0, 240, 255, 0.25) 100%) !important;
            border-color: #00f0ff !important;
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.45), inset 0 0 8px rgba(0, 240, 255, 0.2);
        }
        .artist-card.highlighted .artist-name {
            color: #ffffff !important;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
        }

        /* Mobile Tab Active Indicator */
        .day-tab-btn.active {
            background: linear-gradient(135deg, #00f0ff 0%, #0088ff 100%);
            color: #070913;
            font-weight: 900;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
        }

        /* Floating Touch Drag Ghost */
        #touch-ghost {
            pointer-events: none;
            position: fixed;
            z-index: 9999;
            opacity: 0.9;
            transform: translate(-50%, -50%) scale(1.03);
            box-shadow: 0 10px 25px rgba(0, 240, 255, 0.5);
            display: none;
        }
    </style>
</head>
<body class="text-slate-100 font-sans min-h-screen flex flex-col pb-24 selection:bg-cdj-magenta selection:text-white">

    <!-- App Header (Compact Mobile First) -->

        <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
            
            <div class="flex items-center gap-2 min-w-0">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-cdj-magenta to-cdj-cyan flex items-center justify-center font-black text-slate-950 text-xs shadow-md flex-shrink-0">
                    CDJ
                </div>
                <div class="min-w-0">
                    <div class="flex items-center gap-1.5">
                        <h1 class="text-base sm:text-xl font-black font-display tracking-tight text-white truncate">
                            CDJ <span class="text-cdj-cyan">26/27</span>
                        </h1>
                        <span class="text-[10px] bg-cdj-magenta/20 text-cdj-magenta border border-cdj-magenta/30 font-bold px-1.5 py-0.2 rounded">
                            UNOFFICIAL
                        </span>
                    </div>
                    <p class="text-[10px] text-slate-400 truncate">幕張メッセ 国際展示場 1〜11ホール</p>
                </div>
            </div>

            <!-- Header Action Controls -->
            <div class="flex items-center gap-1.5 flex-shrink-0">
                <button id="add-artist-btn" class="flex items-center gap-1 bg-cdj-cyan text-slate-950 font-black text-xs px-2.5 py-1.5 rounded-xl shadow-md active:scale-95 transition">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    <span class="hidden sm:inline">추가</span>
                </button>
                <button id="reset-btn" title="초기화" class="p-2 bg-slate-900 text-slate-400 hover:text-white border border-cdj-border rounded-xl active:scale-95 transition">
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Mobile Day Navigation Tabs -->
    <nav class="sticky top-[57px] z-30 bg-slate-950/95 border-b border-cdj-border/80 px-3 py-2.5 backdrop-blur-md overflow-x-auto no-scrollbar">
        <div class="flex items-center gap-2 max-w-7xl mx-auto min-w-max">
            <button class="day-tab-btn active text-xs py-2 px-3.5 rounded-xl font-bold flex items-center gap-1.5 transition" data-target-day="all">
                <span>전체일자</span>

            <button class="day-tab-btn bg-cdj-panel border border-cdj-border text-slate-300 text-xs py-2 px-3 rounded-xl font-bold flex items-center gap-1.5 transition" data-target-day="12/26">
                <span>12/26 (土)</span>
                <span class="tab-badge text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.2 rounded-full" id="tab-count-1226">0</span>
            </button>
            <button class="day-tab-btn bg-cdj-panel border border-cdj-border text-slate-300 text-xs py-2 px-3 rounded-xl font-bold flex items-center gap-1.5 transition" data-target-day="12/27">
                <span>12/27 (日)</span>
                <span class="tab-badge text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.2 rounded-full" id="tab-count-1227">0</span>
            </button>
            <button class="day-tab-btn bg-cdj-panel border border-cdj-border text-slate-300 text-xs py-2 px-3 rounded-xl font-bold flex items-center gap-1.5 transition" data-target-day="12/29">
                <span>12/29 (火)</span>

            </div>

            <!-- Quick Filter Badges -->
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
                <button id="filter-selected-btn" class="filter-chip bg-cdj-panel border border-cdj-border text-slate-300 text-xs px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5 whitespace-nowrap active:scale-95 transition">

                    <input type="text" id="modal-name" required placeholder="예: Official髭男dism" class="w-full bg-slate-900 border border-cdj-border text-xs rounded-xl p-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-cdj-cyan">

                <div class="pt-2 flex gap-2">
                    <button type="button" id="cancel-modal-btn" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl text-xs">

                        추가하기
                    </button>
                </div>
            </form>
        </div>
    </div>

        // Format into state array with IDs
        const defaultArtists = initialRawData.map((item, idx) => ({
            id: 'art-' + (idx + 1),
            date: item.date,
            name: item.name,
            isNew: item.isNew,
            selected: false
        }));

        // State variables
        let artists = JSON.parse(localStorage.getItem('cdj2627_mobile_lineup')) || defaultArtists;
        let activeTab = 'all';
        let searchQuery = '';
        let onlySelected = false;
        let onlyNew = false;

        // Mobile Touch Drag State
        let touchDraggedArtist = null;

        function initIcons() {
            if (window.lucide) lucide.createIcons();
        }

        // Main Render Function
        function render() {
            const days = ['12/26', '12/27', '12/29', '12/30', '12/31'];

            days.forEach(day => {
                const dayKey = day.replace('/', '');
                const listEl = document.getElementById(`list-${dayKey}`);
                const countEl = document.getElementById(`count-${dayKey}`);
                const tabBadgeEl = document.getElementById(`tab-count-${dayKey}`);
                const columnEl = listEl ? listEl.closest('.day-column') : null;

                if (!listEl) return;

                // Handle Mobile Tab Visibilities
                if (activeTab === 'all' || activeTab === day) {
                    if (columnEl) columnEl.classList.remove('hidden');
                } else {
                    if (columnEl) columnEl.classList.add('hidden');
                }

                const dayArtists = artists.filter(a => a.date === day);
                const selectedInDay = dayArtists.filter(a => a.selected).length;

                if (countEl) countEl.innerText = `${selectedInDay}/${dayArtists.length}`;
                if (tabBadgeEl) {
                    tabBadgeEl.innerText = `${selectedInDay}`;
                    if (selectedInDay > 0) {
                        tabBadgeEl.className = 'tab-badge text-[10px] bg-cdj-cyan text-slate-950 font-black px-1.5 py-0.2 rounded-full';
                    } else {
                        tabBadgeEl.className = 'tab-badge text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.2 rounded-full';
                    }
                }

                // Filter logic
                const filtered = dayArtists.filter(a => {
                    const matchSearch = a.name.toLowerCase().includes(searchQuery.toLowerCase());
                    const matchSelected = !onlySelected || a.selected;
                    const matchNew = !onlyNew || a.isNew;
                    return matchSearch && matchSelected && matchNew;
                });

                if (filtered.length === 0) {
                    listEl.innerHTML = `
                        <div class="h-20 flex flex-col items-center justify-center border border-dashed border-cdj-border/60 rounded-xl text-slate-500 text-xs p-2 text-center pointer-events-none select-none">
                            <i data-lucide="inbox" class="w-4 h-4 mb-1 opacity-40"></i>
                            아티스트 없음
                        </div>
                    `;
                } else {
                    listEl.innerHTML = filtered.map(artist => `
                        <div data-id="${artist.id}" 
                             draggable="true" 
                             onclick="handleCardClick('${artist.id}', event)"
                             class="artist-card bg-cdj-card border ${artist.selected ? 'highlighted' : 'border-cdj-border'} p-2.5 rounded-xl flex items-center justify-between gap-2 relative group cursor-pointer active:scale-[0.99] transition">
                            
                            <div class="flex items-center gap-2.5 min-w-0 flex-1 pointer-events-none">
                                <input type="checkbox" ${artist.selected ? 'checked' : ''} 
                                       class="artist-checkbox w-4 h-4 rounded border-slate-600 text-cdj-cyan focus:ring-0 focus:ring-offset-0 bg-slate-900 cursor-pointer flex-shrink-0">
                                
                                <span class="artist-name font-bold text-xs text-slate-200 truncate group-hover:text-cdj-cyan transition-colors">
                                    ${escapeHtml(artist.name)}
                                </span>

                                ${artist.isNew ? `
                                    <span class="text-[8px] font-black bg-cdj-magenta text-white px-1.5 py-0.2 rounded uppercase tracking-tighter flex-shrink-0 shadow-sm">
                                        NEW
                                    </span>
                                ` : ''}
                            </div>

                            <div class="flex items-center gap-1.5 flex-shrink-0">
                                <button onclick="deleteArtist('${artist.id}', event)" title="삭제" class="text-slate-600 hover:text-red-400 p-1 active:scale-90 transition">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                                <span class="drag-handle text-slate-500 hover:text-cdj-cyan p-1 cursor-grab active:cursor-grabbing touch-none" title="드래그하여 이동">

                                </span>
                            </div>

            // Update Footer Totals
            const totalCount = artists.length;
            const selectedCount = artists.filter(a => a.selected).length;
            document.getElementById('footer-total-count').innerText = totalCount;
            document.getElementById('footer-selected-count').innerText = selectedCount;

            initIcons();
            saveToLocalStorage();

        // Card Click Handler
        window.handleCardClick = function(id, event) {
            // Ignore if clicking delete button or drag handle
            if (event.target.closest('button') || event.target.closest('.drag-handle')) {
                return;
            }
            artists = artists.map(a => a.id === id ? { ...a, selected: !a.selected } : a);
            render();
        }

        // Delete Artist
        window.deleteArtist = function(id, event) {
            if(event) event.stopPropagation();
            artists = artists.filter(a => a.id !== id);
            render();
        }

        // Touch & Desktop HTML5 Drag & Drop Logic
        function attachDragAndDrop() {
            const cards = document.querySelectorAll('.artist-card');
            const lists = document.querySelectorAll('.artist-list');

            // Desktop Drag & Drop
            cards.forEach(card => {
                card.addEventListener('dragstart', (e) => {
                    card.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', card.getAttribute('data-id'));
                });

                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                    lists.forEach(l => l.classList.remove('drag-over'));
                });

                // Mobile Touch Drag Handle listeners
                const handle = card.querySelector('.drag-handle');
                if (handle) {
                    handle.addEventListener('touchstart', (e) => handleTouchStart(e, card), { passive: false });
                    handle.addEventListener('touchmove', handleTouchMove, { passive: false });
                    handle.addEventListener('touchend', handleTouchEnd);
                }
            });

            lists.forEach(list => {
                list.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    list.classList.add('drag-over');
                    const draggingCard = document.querySelector('.dragging');
                    if (draggingCard) {
                        const afterElement = getDragAfterElement(list, e.clientY);
                        if (afterElement == null) {
                            list.appendChild(draggingCard);
                        } else {
                            list.insertBefore(draggingCard, afterElement);
                        }
                    }
                });

                list.addEventListener('dragleave', () => list.classList.remove('drag-over'));

                list.addEventListener('drop', (e) => {
                    e.preventDefault();
                    list.classList.remove('drag-over');
                    updateStateFromDOM();
                });
            });
        }

        // Mobile Touch Handlers
        const ghostEl = document.getElementById('touch-ghost');
        const ghostNameEl = document.getElementById('ghost-name');

        function handleTouchStart(e, card) {
            const touch = e.touches[0];
            const artistId = card.getAttribute('data-id');
            const artist = artists.find(a => a.id === artistId);

            if (!artist) return;
            touchDraggedArtist = card;

            card.classList.add('dragging');
            ghostNameEl.innerText = artist.name;
            ghostEl.style.display = 'block';
            ghostEl.style.left = touch.clientX + 'px';
            ghostEl.style.top = touch.clientY + 'px';

            e.preventDefault();
        }

        function handleTouchMove(e) {
            if (!touchDraggedArtist) return;
            e.preventDefault();
            const touch = e.touches[0];

            ghostEl.style.left = touch.clientX + 'px';
            ghostEl.style.top = touch.clientY + 'px';

            const elementUnder = document.elementFromPoint(touch.clientX, touch.clientY);
            if (!elementUnder) return;

            const targetList = elementUnder.closest('.artist-list');
            if (targetList) {
                document.querySelectorAll('.artist-list').forEach(l => l.classList.remove('drag-over'));
                targetList.classList.add('drag-over');

                const afterElement = getDragAfterElement(targetList, touch.clientY);
                if (afterElement == null) {
                    targetList.appendChild(touchDraggedArtist);
                } else {
                    targetList.insertBefore(touchDraggedArtist, afterElement);
                }
            }
        }

        function handleTouchEnd() {
            if (touchDraggedArtist) {
                touchDraggedArtist.classList.remove('dragging');
                touchDraggedArtist = null;
            }
            ghostEl.style.display = 'none';
            document.querySelectorAll('.artist-list').forEach(l => l.classList.remove('drag-over'));
            updateStateFromDOM();
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.artist-card:not(.dragging)')];

            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function updateStateFromDOM() {
            const newArtists = [];
            const days = ['12/26', '12/27', '12/29', '12/30', '12/31'];

            days.forEach(day => {
                const listEl = document.getElementById(`list-${day.replace('/', '')}`);
                if (!listEl) return;
                
                const cardNodes = listEl.querySelectorAll('.artist-card');
                cardNodes.forEach(node => {
                    const id = node.getAttribute('data-id');
                    const existing = artists.find(a => a.id === id);
                    if (existing) {
                        newArtists.push({
                            ...existing,
                            date: day
                        });
                    }
                });
            });

            // Preserve any filtered out
            artists.forEach(a => {
                if (!newArtists.some(na => na.id === a.id)) {
                    newArtists.push(a);
                }
            });

            artists = newArtists;
            render();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function saveToLocalStorage() {
            localStorage.setItem('cdj2627_mobile_lineup', JSON.stringify(artists));
        }

        // Initialize DOM Events
        document.addEventListener('DOMContentLoaded', () => {
            render();

            // Mobile Tabs Listener
            document.querySelectorAll('.day-tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.day-tab-btn').forEach(b => {
                        b.className = 'day-tab-btn bg-cdj-panel border border-cdj-border text-slate-300 text-xs py-2 px-3 rounded-xl font-bold flex items-center gap-1.5 transition';
                    });
                    btn.className = 'day-tab-btn active text-xs py-2 px-3.5 rounded-xl font-bold flex items-center gap-1.5 transition';
                    activeTab = btn.getAttribute('data-target-day');
                    render();
                });
            });

            // Search Filter
            const searchInput = document.getElementById('search-input');
            const clearSearchBtn = document.getElementById('clear-search-btn');

            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                if (searchQuery) {
                    clearSearchBtn.classList.remove('hidden');
                } else {
                    clearSearchBtn.classList.add('hidden');
                }
                render();
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchQuery = '';
                clearSearchBtn.classList.add('hidden');
                render();
            });

            // Quick Filter Chips
            const filterSelectedBtn = document.getElementById('filter-selected-btn');
            const filterNewBtn = document.getElementById('filter-new-btn');

            filterSelectedBtn.addEventListener('click', () => {
                onlySelected = !onlySelected;
                filterSelectedBtn.classList.toggle('border-cdj-cyan', onlySelected);
                filterSelectedBtn.classList.toggle('text-cdj-cyan', onlySelected);
                render();
            });

            filterNewBtn.addEventListener('click', () => {
                onlyNew = !onlyNew;
                filterNewBtn.classList.toggle('border-cdj-magenta', onlyNew);
                filterNewBtn.classList.toggle('text-cdj-magenta', onlyNew);
                render();
            });

            // Footer Quick Toggle All / Unselect All
            document.getElementById('quick-toggle-all').addEventListener('click', () => {
                const anySelected = artists.some(a => a.selected);
                artists = artists.map(a => ({ ...a, selected: !anySelected }));
                render();
            });

            // Reset Button
            document.getElementById('reset-btn').addEventListener('click', () => {
                if (confirm('초기 라인업 상태로 리셋하시겠습니까?')) {
                    artists = [...defaultArtists];
                    render();
                }
            });

            // Modal Controls
            const modal = document.getElementById('add-modal');
            document.getElementById('add-artist-btn').addEventListener('click', () => modal.classList.remove('hidden'));
            document.getElementById('close-modal-btn').addEventListener('click', () => modal.classList.add('hidden'));
            document.getElementById('cancel-modal-btn').addEventListener('click', () => modal.classList.add('hidden'));

            document.getElementById('add-artist-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const newName = document.getElementById('modal-name').value.trim();
                const newDate = document.getElementById('modal-date').value;

                if (newName) {
                    artists.unshift({
                        id: 'custom-' + Date.now(),
                        date: newDate,
                        name: newName,
                        isNew: true,
                        selected: true
                    });
                    render();
                    document.getElementById('add-artist-form').reset();
                    modal.classList.add('hidden');
                }
            });
        });
